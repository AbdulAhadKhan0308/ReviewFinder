# Local development database only; the password is not a real secret.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: restaurant_reviews
      POSTGRES_USER: restaurant_reviews
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_reviews -d restaurant_reviews"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
